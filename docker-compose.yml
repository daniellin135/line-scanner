name: line-scanner

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-line_scanner}:${POSTGRES_PASSWORD:-line_scanner}@postgres:5432/${POSTGRES_DB:-line_scanner}
      REDIS_URL: redis://redis:6379/0
      SHARP_API_KEY: ${SHARP_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app:celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-line_scanner}:${POSTGRES_PASSWORD:-line_scanner}@postgres:5432/${POSTGRES_DB:-line_scanner}
      REDIS_URL: redis://redis:6379/0
      SHARP_API_KEY: ${SHARP_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app:celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-line_scanner}:${POSTGRES_PASSWORD:-line_scanner}@postgres:5432/${POSTGRES_DB:-line_scanner}
      REDIS_URL: redis://redis:6379/0
      SHARP_API_KEY: ${SHARP_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-line_scanner}:${POSTGRES_PASSWORD:-line_scanner}@postgres:5432/${POSTGRES_DB:-line_scanner}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-line_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-line_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-line_scanner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
